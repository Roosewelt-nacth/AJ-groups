<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AJ GROUPS | Ventures showcase (design review)</title>
<meta name="theme-color" content="#1b1e2b">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="../assets/fonts.css">
<style>
:root{--bg:#1b1e2b;--ink:#f4f1ea;--gold:#debd87;--line:rgba(244,241,234,.16);--ease:cubic-bezier(.76,0,.24,1);--soft:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* top bar */
.top{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:22px clamp(18px,3vw,44px);pointer-events:none}
.top>*{pointer-events:auto}
.top img{height:34px;width:auto;display:block}
.top .ttl{font:400 clamp(15px,1.4vw,19px)/1.15 'Instrument Serif',serif;letter-spacing:.01em;text-align:center;opacity:.9}
.top .ttl em{color:var(--gold)}
.top .back{font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:10px 16px;border:1px solid var(--line);border-radius:999px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background:rgba(27,30,43,.35);transition:background .3s}
.top .back:hover{background:rgba(244,241,234,.14)}

/* the panel row */
.rail{position:fixed;inset:0;display:flex}
.pn{position:relative;flex:1 1 0;min-width:0;overflow:hidden;border-left:1px solid var(--line);cursor:pointer;transition:flex-grow .9s var(--ease);outline:0}
.pn:first-child{border-left:0}
.pn.on{flex-grow:13}

/* photo: wipes up from the bottom when the panel opens */
.ph{position:absolute;inset:0;clip-path:inset(100% 0 0 0);transition:clip-path .9s var(--ease)}
.pn.on .ph{clip-path:inset(0 0 0 0)}
.ph img{position:absolute;top:0;left:50%;height:100%;width:max(100%,calc(100vw * .66));transform:translateX(-50%) scale(1.14);object-fit:cover;transition:transform 2.4s var(--soft)}
.pn.on .ph img{transform:translateX(-50%) scale(1)}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,30,43,.55),rgba(27,30,43,0) 30%,rgba(27,30,43,0) 45%,rgba(27,30,43,.82)),linear-gradient(90deg,rgba(27,30,43,.3),transparent 50%)}

/* closed panel: number and a vertical-feeling label at the foot */
.cl{position:absolute;left:clamp(12px,1.3vw,22px);right:10px;bottom:clamp(54px,9vh,96px);transition:opacity .4s ease,transform .6s var(--soft)}
.cl small{display:block;font-size:11px;letter-spacing:.22em;color:var(--gold);margin-bottom:10px}
.cl b{display:block;font:400 clamp(12px,1.05vw,17px)/1.15 'Instrument Serif',serif;text-transform:uppercase;letter-spacing:.05em;overflow-wrap:anywhere;font-weight:400}
.pn.on .cl{opacity:0;transform:translateY(14px);pointer-events:none}
.pn:not(.on):hover .cl{transform:translateY(-6px)}
.pn:not(.on)::before{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,rgba(222,189,135,.14),transparent);transition:height .5s var(--soft)}
.pn:not(.on):hover::before{height:46%}
.st{display:none;position:absolute;left:clamp(12px,1.3vw,22px);bottom:clamp(20px,4vh,40px);font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;transition:opacity .3s;white-space:nowrap;overflow:hidden;max-width:calc(100% - 20px)}
.pn.on .st{opacity:0}

/* open panel: big name, one line, a round thumbnail with an arrow */
.op{position:absolute;top:0;bottom:0;left:0;width:min(66vw,1180px);padding:clamp(80px,12vh,120px) clamp(22px,3.4vw,56px) clamp(26px,5vh,54px);display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
.op>*{opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .8s var(--soft)}
.pn:not(.on) .op{visibility:hidden;transition:visibility 0s .4s}
.pn.on .op>*{opacity:1!important;transform:none}
.pn.on .op>:nth-child(1){transition-delay:.45s}.pn.on .op>:nth-child(2){transition-delay:.55s}.pn.on .op>:nth-child(3){transition-delay:.68s}.pn.on .op>:nth-child(4){transition-delay:.8s}
.op .no{font-size:12px;letter-spacing:.26em;color:var(--gold);margin-bottom:14px}
.op h2{font:400 clamp(40px,6.4vw,104px)/.98 'Instrument Serif',serif;letter-spacing:-.01em;text-transform:uppercase;max-width:9em;text-shadow:0 2px 40px rgba(27,30,43,.5)}
.op h2 em{display:block;font-style:italic;text-transform:none;color:var(--gold);font-size:.52em;margin-top:.18em;letter-spacing:0}
.op p{opacity:1;font-size:clamp(13px,1.05vw,15px);line-height:1.6;max-width:36ch;margin-top:18px;opacity:.9}
.op .row{display:flex;align-items:center;gap:14px;margin-top:22px}
.op .pill{display:inline-block;padding:10px 18px;border:1px solid rgba(244,241,234,.4);border-radius:999px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;background:rgba(27,30,43,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.go{position:absolute;right:clamp(18px,3vw,48px);bottom:clamp(26px,5vh,54px);width:clamp(76px,7vw,108px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:1px solid rgba(244,241,234,.5);opacity:0;transform:scale(.4);transition:opacity .4s ease,transform .8s var(--soft);pointer-events:auto}
.pn.on .go{opacity:1;transform:none;transition-delay:.85s}
.go img{width:100%;height:100%;object-fit:cover;filter:saturate(1.1)}
.go::after{content:"\2192";position:absolute;inset:0;display:grid;place-items:center;font-size:22px;background:rgba(27,30,43,.42);transition:background .3s}
.go:hover::after{background:rgba(27,30,43,.2)}

/* progress line that shows how long this panel stays open while auto-playing */
.bar{position:fixed;left:0;bottom:0;height:3px;width:100%;z-index:11;background:rgba(244,241,234,.1)}
.bar i{display:block;height:100%;width:0;background:var(--gold)}
.bar.run i{width:100%;transition:width var(--t,5s) linear}

/* intro: the panels rise one after another */
.pn{opacity:0;transform:translateY(40px)}
.go-intro .pn{opacity:1;transform:none;transition:flex-grow .9s var(--ease),opacity .9s ease,transform 1s var(--soft)}
.go-intro .pn:nth-child(1){transition-delay:0s,.05s,.05s}.go-intro .pn:nth-child(2){transition-delay:0s,.12s,.12s}.go-intro .pn:nth-child(3){transition-delay:0s,.19s,.19s}.go-intro .pn:nth-child(4){transition-delay:0s,.26s,.26s}.go-intro .pn:nth-child(5){transition-delay:0s,.33s,.33s}.go-intro .pn:nth-child(6){transition-delay:0s,.4s,.4s}.go-intro .pn:nth-child(7){transition-delay:0s,.47s,.47s}.go-intro .pn:nth-child(8){transition-delay:0s,.54s,.54s}
.done .go-intro .pn{transition-delay:0s}

/* phones and tablets: the panels stack and open downwards */
@media (min-width:821px) and (max-width:1250px){
 .cl{bottom:clamp(30px,6vh,60px);left:50%;right:auto;transform:translateX(-50%)}
 .cl small{margin:0 0 12px;text-align:center}
 .cl b{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:15px;letter-spacing:.12em;margin:0 auto}
 .pn:not(.on):hover .cl{transform:translateX(-50%) translateY(-6px)}
}
@media (max-width:820px){
 .op{width:auto;right:0}
 .top .ttl{display:none}
 .top img{height:28px}
 .rail{flex-direction:column;top:66px}
 .pn{border-left:0;border-top:1px solid var(--line);transition:flex-grow .9s var(--ease)}
 .pn:first-child{border-top:0}
 .pn.on{flex-grow:9}
 .ph img{width:100%;height:100%;transform:scale(1.12)}
 .pn.on .ph img{transform:scale(1)}
 .ph{clip-path:inset(0 100% 0 0)}
 .pn.on .ph{clip-path:inset(0 0 0 0)}
 .cl{bottom:auto;top:50%;left:18px;right:18px;transform:translateY(-50%);display:flex;align-items:baseline;gap:14px}
 .cl small{margin:0}
 .cl b{font-size:19px}
 .pn:not(.on):hover .cl{transform:translateY(-50%)}
 .st{display:none}
 .op{padding:78px 20px 18px}
 .op h2{font-size:clamp(34px,10vw,52px)}
 .op p{opacity:1;font-size:13px;max-width:30ch;margin-top:12px}
 .op .row{margin-top:14px}
 .go{width:64px;right:16px;bottom:18px}
}
@media (max-height:560px) and (min-width:821px){.op p{display:none}.op h2{font-size:clamp(34px,5vw,64px)}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>
<header class="top">
  <a href="../" aria-label="AJ GROUPS home"><img src="../assets/brand/logo-horizontal-gold.webp" alt="AJ GROUPS" width="140" height="34"></a>
  <p class="ttl">Diverse ventures, <em>one vision</em></p>
  <a class="back" href="../">Back to site</a>
</header>

<main class="rail" id="rail" aria-label="AJ GROUPS ventures"></main>
<div class="bar" id="bar" aria-hidden="true"><i></i></div>

<script>
// The eight ventures, in the same order and wording as the group page.
var V = [
 {n:'Bun Bun Cafe',   h:'Food &amp; <em>Beverage</em>',                 p:'Delicious treats and delightful food experiences.',                                      s:'Opening soon',          i:'bun.webp?v=2'},
 {n:'Alven Studio',   h:'Creative &amp; <em>Digital Marketing</em>',    p:'Creative solutions that help brands build their identity and grow.',                     s:'Launching December 6',  i:'alven.webp'},
 {n:'House of Fovo',  h:'Photography &amp; <em>Videography</em>',       p:'Capturing stories, emotions and unforgettable moments.',                                 s:'Launching December 13', i:'fovo.webp'},
 {n:'AJ Little Wonder World', h:'Stories, learning <em>and play</em>',  p:'Stories, learning videos and play, made for children and tried out with them.',          s:'Date to be announced',  i:'little.webp'},
 {n:'Clothing Brand', h:'Exploring <em>distinctive styles</em>',        p:'Exploring distinctive styles and new possibilities in fashion.',                         s:'Coming soon',           i:'fashion.webp'},
 {n:'AJ Software Solutions', h:'Technology &amp; <em>Development</em>', p:'Websites, applications and custom digital solutions for modern businesses.',            s:'Coming soon',           i:'software.webp'},
 {n:'Online Course',  h:'Learning, <em>made practical</em>',            p:'Practical learning experiences for everyday needs.',                                     s:'Coming soon',           i:'course.webp'},
 {n:'Digital Products', h:'Practical <em>digital resources</em>',       p:'Practical digital resources for everyday needs.',                                        s:'Coming soon',           i:'digital.webp'}
];
var rail = document.getElementById('rail'), bar = document.getElementById('bar'), pans = [], cur = -1, timer = 0, auto = true, HOLD = 5200;
var small = function(){ return matchMedia('(max-width:820px)').matches };

V.forEach(function(v, k){
  var no = (k < 9 ? '0' : '') + (k + 1), src = '../assets/ventures/' + v.i;
  var el = document.createElement('div');
  el.className = 'pn'; el.tabIndex = 0; el.setAttribute('role', 'button'); el.setAttribute('aria-label', v.n + ': ' + v.s);
  el.innerHTML =
    '<div class="ph"><img src="' + src + '" alt="" decoding="async"></div>' +
    '<div class="cl"><small>' + no + '</small><b>' + v.n + '</b></div>' +
    '<span class="st">' + v.s + '</span>' +
    '<div class="op"><span class="no">' + no + ' / 08</span><h2>' + v.h + '</h2><p>' + v.p + '</p><div class="row"><span class="pill">' + v.s + '</span></div></div>' +
    '<a class="go" href="#" aria-label="' + v.n + ' details" tabindex="-1"><img src="' + src + '" alt=""></a>';
  el.addEventListener('click', function(e){ if (e.target.closest('.go')) e.preventDefault(); stop(); open(k); });
  el.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); stop(); open(k); } });
  el.addEventListener('mouseenter', function(){ if (!small() && matchMedia('(hover:hover)').matches) { stop(); open(k); } });
  rail.appendChild(el); pans.push(el);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { stop(); open((cur + 1) % pans.length); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { stop(); open((cur + pans.length - 1) % pans.length); }
});

function open(k){
  if (k === cur) return;
  if (cur > -1) pans[cur].classList.remove('on');
  cur = k; pans[k].classList.add('on');
}
function runBar(){
  bar.classList.remove('run'); bar.firstElementChild.style.transition = 'none'; bar.firstElementChild.style.width = '0';
  void bar.offsetWidth; bar.firstElementChild.style.transition = ''; bar.style.setProperty('--t', HOLD + 'ms'); bar.classList.add('run');
}
function tick(){ open((cur + 1) % pans.length); runBar(); timer = setTimeout(tick, HOLD); }
function stop(){ auto = false; clearTimeout(timer); bar.classList.remove('run'); bar.firstElementChild.style.width = '0'; }

// opening: panels rise, then each venture opens in turn (like the reference), until the visitor takes over
var rm = matchMedia('(prefers-reduced-motion:reduce)').matches;
setTimeout(function(){
  document.body.classList.add('go-intro');
  setTimeout(function(){ document.documentElement.classList.add('done'); open(0); if (!rm) { runBar(); timer = setTimeout(tick, HOLD); } }, 900);
}, 60);
</script>
</body>
</html>
