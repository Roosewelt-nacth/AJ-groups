<title>AJ Groups Reel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/*
  9:16 reel canvas in the AJ GROUPS site palette (navy #2d3041, gold #debd87, cream #f4f1ea).
  The screen shows the real ajgroups.co, captured at 1440x868: home, about, vision, ventures.
  20s loop, pure CSS, cinematic pass (macro open, crane + orbit, spill light, dust, grain):
  0-5%    curtain lifts on a top-down shot of the closed laptop
  6-28%   camera drops to the reference pose: near eye level, slight look down, rolled ~10deg, right side receding
  24-38%  lid swings open with a small overshoot, screen wakes on the home chapter
  38-96%  hold with gentle sway + float; the site steps through its chapters like a scroll
  94-100% curtain, loop
  3D rules: only .rig and .lid preserve-3d, never opacity/filter on them, no coplanar painted planes.
*/
:root{
  --navy:#2d3041;
  --navy-ink:#171824;
  --gold:#debd87;
  --gold-deep:#b98f4f;
  --cream:#f4f1ea;
  --cream-deep:#e2dacb;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;background:var(--navy-ink);overflow:hidden;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.frame{
  position:relative;overflow:hidden;container-type:size;
  height:min(100vh,177.78vw);width:min(100vw,56.25vh);
  background:radial-gradient(110% 64% at 50% 44%, #faf7f1 0%, var(--cream) 42%, var(--cream-deep) 100%);
}
.frame::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 34% at 60% 44%, rgba(222,189,135,.26), transparent 70%)}

.label{position:absolute;left:0;right:0;z-index:3;display:flex;justify-content:center;color:var(--navy);pointer-events:none}
.label.top{top:max(9cqw,env(safe-area-inset-top,0px) + 5cqw);align-items:center;gap:2cqw;font-size:4.4cqw;letter-spacing:-.02em}
.label.top img{display:block;height:8.6cqw;width:auto;aspect-ratio:900/196}
.label.bottom{bottom:max(10cqw,env(safe-area-inset-bottom,0px) + 6cqw);flex-direction:column;align-items:center;gap:2.2cqw;text-align:center;animation:capIn 20s linear infinite}
.label.bottom b{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:8.4cqw;letter-spacing:-.02em;line-height:1}
.label.bottom b em{font-style:italic;color:var(--gold-deep)}
.label.bottom span{font-size:2.7cqw;letter-spacing:.32em;text-transform:uppercase;opacity:.55}
@keyframes capIn{0%,80%{opacity:0;transform:translateY(2cqw)}86%,95%{opacity:1;transform:none}99%,100%{opacity:0;transform:none}}

/* ---------- 3D laptop ---------- */
.scene{position:absolute;inset:0;perspective:330cqw;perspective-origin:50% 52%}
.rig{
  position:absolute;left:4.6cqw;top:calc(63% - 52.5cqw);width:84cqw;height:52.5cqw;
  transform-style:preserve-3d;transform-origin:50% 100% 20cqw;
  transform:translateY(0cqw) rotateZ(10deg) rotateX(-15deg) rotateY(26deg) scale(.885);
  animation:camera 20s linear infinite, bob 5.2s ease-in-out infinite;
}
@keyframes camera{
  0%    {transform:translateY(-22cqw) rotateZ(-7deg) rotateX(-84deg) rotateY(0deg)  scale(1.9)}
  4%    {transform:translateY(-22cqw) rotateZ(-6deg) rotateX(-84deg) rotateY(0deg)  scale(1.82)}
  14%   {transform:translateY(-28cqw) rotateZ(-1deg) rotateX(-70deg) rotateY(6deg)  scale(1.0)}
  26%   {transform:translateY(-12cqw) rotateZ(7deg)  rotateX(-32deg) rotateY(20deg) scale(.82)}
  38%   {transform:translateY(0cqw)   rotateZ(10deg) rotateX(-17deg) rotateY(25deg) scale(.845)}
  52%   {transform:translateY(0cqw)   rotateZ(9deg)  rotateX(-13deg) rotateY(30deg) scale(.85)}
  68%   {transform:translateY(0cqw)   rotateZ(7deg)  rotateX(-14deg) rotateY(23deg) scale(.86)}
  84%   {transform:translateY(0cqw)   rotateZ(10deg) rotateX(-16deg) rotateY(27deg) scale(.85)}
  96%   {transform:translateY(0cqw)   rotateZ(10deg) rotateX(-15deg) rotateY(26deg) scale(.845)}
  100%  {transform:translateY(-22cqw) rotateZ(-7deg) rotateX(-84deg) rotateY(0deg)  scale(1.9)}
}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -1.8cqw}}

/* lid: hinge on its bottom edge. -90deg = closed on the base, +11deg = open, leaning back */
.lid{position:absolute;left:0;top:0;width:100%;height:100%;transform-style:preserve-3d;transform-origin:50% 100%;transform:rotateX(11deg);animation:lid 20s linear infinite}
@keyframes lid{
  0%,26% {transform:rotateX(-90deg)}
  32%    {transform:rotateX(-22deg)}
  35.5%  {transform:rotateX(15deg)}
  39%,96%{transform:rotateX(11deg)}
  100%   {transform:rotateX(-90deg)}
}
.face{position:absolute;inset:0;border-radius:2.6cqw 2.6cqw 1cqw 1cqw;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.lid-front{transform:translateZ(.3cqw);background:#0b0c12;box-shadow:inset 0 0 0 .28cqw #363848}
.lid-back{transform:rotateY(180deg) translateZ(.3cqw);background:linear-gradient(160deg,#454859,#33354a 45%,#262838);box-shadow:inset 0 0 0 .28cqw #555869;display:grid;place-items:center}
.lid-back img{transform:rotate(180deg);height:13cqw;width:auto;opacity:.95;filter:drop-shadow(0 .18cqw .12cqw rgba(0,0,0,.55)) drop-shadow(0 -.1cqw 0 rgba(255,240,200,.35))}
.lid-back::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(112deg,transparent 30%,rgba(255,255,255,.38) 43%,rgba(255,236,200,.2) 50%,transparent 64%);background-size:280% 100%;background-position:120% 0;animation:sheen 20s linear infinite}
@keyframes sheen{0%{background-position:120% 0}9%{background-position:-45% 0}10%,15%{background-position:120% 0}25%{background-position:-45% 0}100%{background-position:-45% 0}}
.base::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,232,190,.26),rgba(255,232,190,.07) 50%,transparent 84%);opacity:0;animation:spill 20s linear infinite}
@keyframes spill{0%,38%{opacity:0}47%,96%{opacity:1}98%,100%{opacity:0}}
.edge{position:absolute;background:linear-gradient(90deg,#5a5d70,#3a3c4d)}
.edge.l{left:0;top:2cqw;width:.6cqw;height:calc(100% - 3cqw);transform-origin:0 0;transform:translateZ(.3cqw) rotateY(90deg)}
.edge.t{left:2cqw;top:0;width:calc(100% - 4cqw);height:.6cqw;transform-origin:0 0;transform:translateZ(.3cqw) rotateX(-90deg);background:linear-gradient(180deg,#666a7d,#3a3c4d)}
.notch{position:absolute;top:.6cqw;left:50%;width:.9cqw;height:.9cqw;margin-left:-.45cqw;border-radius:50%;background:#1d1f2b;box-shadow:inset 0 0 0 .18cqw #343748}

/* base box: keyboard top, front lip, two sides */
.base{position:absolute;left:0;top:100%;width:100%;height:52.5cqw;transform-origin:50% 0;transform:rotateX(90deg) translateZ(-.35cqw);
  border-radius:.8cqw .8cqw 2.6cqw 2.6cqw;background:linear-gradient(180deg,#3a3c4d,#33354a 50%,#2c2e40);box-shadow:inset 0 0 0 .28cqw #4a4d61}
.well{position:absolute;left:6%;right:6%;top:6%;height:49%;border-radius:1cqw;background:#1b1c27;box-shadow:inset 0 .25cqw .6cqw rgba(0,0,0,.6)}
.keys{position:absolute;inset:4% 2.5%;display:grid;grid-template-columns:repeat(14,1fr);grid-template-rows:repeat(6,1fr);gap:.5cqw}
.keys i{border-radius:.35cqw;background:linear-gradient(180deg,#14151e,#0e0f16);box-shadow:inset 0 .12cqw 0 rgba(255,255,255,.06)}
.keys i.w2{grid-column:span 2}.keys i.sp{grid-column:span 6}
.grille{position:absolute;top:8%;height:46%;width:3%;background:radial-gradient(circle,#1d1f2b 30%,transparent 34%) 0 0/.8cqw .8cqw}
.grille.l{left:1.6%}.grille.r{right:1.6%}
.pad{position:absolute;left:31%;right:31%;top:60%;bottom:6%;border-radius:1.4cqw;background:linear-gradient(180deg,#3d4053,#35374b);box-shadow:inset 0 0 0 .2cqw #4c4f63}
.lip{position:absolute;left:0;top:100%;width:100%;height:1.6cqw;transform:translateY(.35cqw) translateZ(52.5cqw);border-radius:0 0 1.4cqw 1.4cqw;background:linear-gradient(180deg,#55586b,#2a2c3c)}
.lip::after{content:"";position:absolute;left:44%;right:44%;top:0;height:40%;border-radius:0 0 .6cqw .6cqw;background:#1f2130}
.side{position:absolute;top:100%;width:52.5cqw;height:1.6cqw;transform-origin:0 0;background:linear-gradient(180deg,#4b4e61,#262838)}
.side.l{left:0;transform:translateY(.35cqw) rotateY(-90deg)}
.side.r{left:100%;transform:translateY(.35cqw) rotateY(-90deg)}
.floor{position:absolute;left:-16%;width:132%;top:100%;height:66cqw;transform-origin:50% 0;transform:rotateX(90deg) translateZ(-2.2cqw) translateY(-7cqw);
  background:radial-gradient(34% 30% at 50% 50%,rgba(20,18,32,.62),rgba(20,18,32,.28) 48%,transparent 74%),radial-gradient(52% 46% at 50% 56%,rgba(45,48,65,.30),transparent 72%);animation:shade 5.2s ease-in-out infinite}
.pool{position:absolute;left:-10%;width:120%;top:100%;height:66cqw;transform-origin:50% 0;transform:rotateX(90deg) translateZ(-2.1cqw) translateY(-4cqw);background:radial-gradient(34% 26% at 50% 78%,rgba(255,224,168,.55),rgba(255,224,168,.2) 50%,transparent 76%);opacity:0;animation:poolIn 20s linear infinite}
@keyframes poolIn{0%,38%{opacity:0}48%,96%{opacity:1}98%,100%{opacity:0}}
@keyframes shade{0%,100%{translate:0 0;opacity:1}50%{translate:0 1.8cqw;opacity:.72}}

/* ---------- screen: the real ajgroups.co ---------- */
.display{position:absolute;inset:1.5cqw 1.5cqw 2.2cqw;border-radius:1.2cqw;overflow:hidden;background:var(--navy)}
.ui{position:absolute;inset:0;opacity:0;animation:wake 20s linear infinite}
@keyframes wake{0%,34%{opacity:0}40%,96%{opacity:1}98%,100%{opacity:0}}
.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;animation:20s linear infinite}
.shot.home{animation-name:sHome}
.shot.about{animation-name:sAbout}
.shot.vision{animation-name:sVision}
.shot.ventures{animation-name:sVentures}
/* each chapter rises in and drifts out upward, the way the site moves on scroll */
@keyframes sHome    {0%,38%{opacity:1;transform:scale(1.05)}58%{opacity:1;transform:scale(1)}60%{opacity:1;transform:translateY(-3%)}60.5%,100%{opacity:0;transform:translateY(-3%)}}
@keyframes sAbout   {0%,59%{opacity:0;transform:translateY(6%)}61%{opacity:1;transform:none}68.5%{opacity:1;transform:scale(1.015)}70%{opacity:1;transform:translateY(-3%)}70.5%,100%{opacity:0;transform:translateY(-3%)}}
@keyframes sVision  {0%,69%{opacity:0;transform:translateY(6%)}71%{opacity:1;transform:none}78.5%{opacity:1;transform:scale(1.015)}80%{opacity:1;transform:translateY(-3%)}80.5%,100%{opacity:0;transform:translateY(-3%)}}
@keyframes sVentures{0%,79%{opacity:0;transform:translateY(6%)}81%{opacity:1;transform:none}100%{opacity:1;transform:scale(1.02)}}
.gloss{position:absolute;inset:-20% -90%;background:linear-gradient(108deg,transparent 41%,rgba(255,255,255,.13) 48%,rgba(255,255,255,.04) 56%,transparent 63%);pointer-events:none;transform:translateX(-30%);animation:glare 20s linear infinite}
@keyframes glare{0%,38%{transform:translateX(-30%)}100%{transform:translateX(30%)}}
/* the live site: runs at its real laptop size and is scaled down into the display; the captures stay underneath as a fallback */
.live{position:absolute;left:0;top:0;border:0;transform-origin:0 0;opacity:0;pointer-events:none;background:var(--navy);transition:opacity .4s}
.display.is-live .live{opacity:1}
.display.is-live .shot{visibility:hidden}

.curtain{position:absolute;inset:0;z-index:9;background:var(--navy-ink);pointer-events:none;animation:curtain 20s linear infinite}
@keyframes curtain{0%{opacity:1}4%{opacity:0}94%{opacity:0}98%,100%{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .rig,.lid,.floor,.ui,.shot,.label.bottom,.curtain{animation:none}
  .ui,.label.bottom,.shot.home{opacity:1}
  .curtain{opacity:0}
}

/* ================= cinematic layer ================= */
.cine{position:absolute;inset:0;pointer-events:none}
.beam{overflow:hidden}
.beam::before{content:"";position:absolute;inset:-20% -40%;background:linear-gradient(112deg,transparent 40%,rgba(255,236,200,var(--beam-a1)) 47%,rgba(255,236,200,var(--beam-a2)) 53%,transparent 61%);transform:translateX(-26%);animation:beamMove 20s linear infinite;filter:blur(1.2cqw)}
@keyframes beamMove{0%{transform:translateX(-26%)}100%{transform:translateX(26%)}}
.motes{overflow:hidden}
.motes.mfront{filter:blur(1.2cqw)}
.motes.mback{filter:blur(.12cqw)}
.motes i{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--mote) 0,transparent 68%);animation-name:moteDrift,moteTwinkle;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite;opacity:.4}
@keyframes moteDrift{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
@keyframes moteTwinkle{0%,100%{opacity:.12}50%{opacity:.85}}
.grade{background:linear-gradient(180deg,rgba(222,189,135,var(--grade-top)),transparent 38%,transparent 62%,rgba(45,48,65,var(--grade-bot)));mix-blend-mode:soft-light}
.vig{background:radial-gradient(118% 88% at 50% 46%,transparent 50%,rgba(var(--vig-rgb),var(--vig-a)) 100%)}
.grain{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");background-size:320px 320px;opacity:var(--grain-a);mix-blend-mode:overlay;animation:grainShift .5s steps(1) infinite}
@keyframes grainShift{0%{background-position:0 0}20%{background-position:-70px 40px}40%{background-position:50px -90px}60%{background-position:-120px -30px}80%{background-position:90px 80px}}
.streak{position:absolute;left:-10%;width:120%;top:var(--streak-y);height:.55cqw;background:linear-gradient(90deg,transparent,rgba(255,232,190,.0) 12%,rgba(255,238,205,.95) 50%,rgba(255,232,190,.0) 88%,transparent);filter:blur(.35cqw);opacity:0;mix-blend-mode:screen;animation:streak 20s linear infinite}
@keyframes streak{0%,36%{opacity:0;transform:scaleX(.3)}40%{opacity:.55;transform:scaleX(1)}47%{opacity:0;transform:scaleX(1.1)}100%{opacity:0}}
.scene{animation:focus 20s linear infinite,sway 9s ease-in-out infinite}
@keyframes focus{0%{filter:blur(9px)}7%{filter:blur(0)}13.5%{filter:blur(0)}15%{filter:blur(1.4px)}17%,100%{filter:blur(0)}}
@keyframes sway{0%,100%{transform:rotate(-.28deg) translate(-.35cqw,.1cqw)}50%{transform:rotate(.32deg) translate(.4cqw,.3cqw)}}
.label.top{animation:topIn 20s linear infinite}
@keyframes topIn{0%,7%{opacity:0;transform:translateY(-1.5cqw)}14%,95%{opacity:1;transform:none}98%,100%{opacity:0}}

.frame{--beam-a1:.20;--beam-a2:.08;--mote:rgba(222,189,135,.9);--grade-top:.16;--grade-bot:.20;--vig-rgb:62,48,40;--vig-a:.34;--grain-a:.16;--streak-y:41%}

</style>

<div class="frame">
  <div class="label top"><img src="brand/logo-horizontal-navy.webp" alt="AJ GROUPS, infinite possibilities"></div>

  <div class="cine beam"></div>
  <div class="cine motes mback" id="motesBack"></div>
  <div class="scene">
    <div class="rig">
      <div class="floor"></div>
      <div class="pool"></div>
      <div class="base">
        <div class="grille l"></div><div class="grille r"></div>
        <div class="well"><div class="keys" id="keys"></div></div>
        <div class="pad"></div>
      </div>
      <div class="side l"></div>
      <div class="side r"></div>
      <div class="lip"></div>
      <div class="lid">
        <div class="edge l"></div>
        <div class="edge t"></div>
        <div class="face lid-back"><img src="brand/logo-mark-gold.webp" alt=""></div>
        <div class="face lid-front">
          <span class="notch"></span>
          <div class="display">
            <div class="ui">
              <img class="shot home" src="shots/home.jpg" alt="AJ Groups home page: One-stop solution">
              <img class="shot about" src="shots/about.jpg" alt="About AJ Groups: A different approach to building businesses">
              <img class="shot vision" src="shots/vision.jpg" alt="Vision: To build a legacy beyond industries">
              <img class="shot ventures" src="shots/ventures.jpg" alt="Our ventures: Different industries, distinct identities">
              <div class="gloss"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="cine motes mfront" id="motesFront"></div>
  <div class="streak"></div>
  <div class="cine grade"></div>
  <div class="cine vig"></div>
  <div class="cine grain"></div>
  <div class="label bottom"><b>One group. <em>Many identities.</em></b><span>ajgroups.co</span></div>
  <div class="curtain"></div>
</div>

<script>

/* drifting dust motes at two depths: small and sharp behind the device, large and soft in front of it */
(function(){
  var back=document.getElementById('motesBack'), front=document.getElementById('motesFront'), seed=11;
  function r(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }
  for(var i=0;i<40;i++){
    var fr=i%6===0, s=document.createElement('i'), size=fr?(6+r()*9):(.8+r()*2.6);
    s.style.cssText='left:'+(r()*100).toFixed(1)+'%;top:'+(r()*100).toFixed(1)+'%;width:'+size.toFixed(2)+'cqw;height:'+size.toFixed(2)+'cqw;'+
      '--dx:'+((r()-.5)*16).toFixed(1)+'cqw;--dy:'+(-8-r()*18).toFixed(1)+'cqw;'+
      'animation-duration:'+(16+r()*16).toFixed(1)+'s,'+(3+r()*5).toFixed(1)+'s;animation-delay:'+(-r()*20).toFixed(1)+'s,'+(-r()*6).toFixed(1)+'s';
    (fr?front:back).appendChild(s);
  }
})();

(function(){
  var h='',rows=[14,13,13,12,12];
  rows.forEach(function(n,r){
    for(var i=0;i<n;i++){
      var w=(r>0&&i===n-1)||(r===4&&i===0);
      h+=w?'<i class="w2"></i>':'<i></i>';
    }
  });
  h+='<i class="w2"></i><i></i><i class="sp"></i><i></i><i class="w2"></i><i></i><i></i>';
  document.getElementById('keys').innerHTML=h;
})();

/* run the real ajgroups.co on the screen so the orb moves, and step it through its chapters in time with the reel */
(function(){
  var W=1440, H=868, LOOP=20000;
  var disp=document.querySelector('.display'), ui=disp.querySelector('.ui');
  var f=document.createElement('iframe');
  f.className='live'; f.src='site/index.html'+(/[?&]rec\b/.test(location.search)?'?fixedres':''); f.title='ajgroups.co, running live';
  f.setAttribute('tabindex','-1'); f.setAttribute('aria-hidden','true');
  f.style.width=W+'px'; f.style.height=H+'px';
  ui.insertBefore(f, ui.querySelector('.gloss'));
  function fit(){ if(disp.clientWidth) f.style.transform='scale('+(disp.clientWidth/W)+')'; }
  if(window.ResizeObserver) new ResizeObserver(fit).observe(disp); fit();

  var doc=null, tries=0;
  function check(){
    try{
      var d=f.contentDocument;
      if(d && d.documentElement.classList.contains('ready') && d.querySelector('.stop.cur')){ doc=d; disp.classList.add('is-live'); return; }
    }catch(e){ return; }
    if(++tries<120) setTimeout(check,250);
  }
  f.addEventListener('load',check);

  var clock=null, stage=-1, labels=['','About','Vision','Ventures'];
  function go(st){
    try{
      if(st===0){ f.contentWindow.scrollTo(0,0); return; }
      var a=[].slice.call(doc.querySelectorAll('.pillnav a')).filter(function(x){return x.textContent.trim()===labels[st];})[0];
      if(a) a.click();
    }catch(e){}
  }
  function tick(){
    if(!clock){ clock=document.getAnimations().filter(function(a){return a.animationName==='camera';})[0]||null; }
    if(doc && clock && clock.currentTime!=null){
      var p=(clock.currentTime%LOOP)/LOOP;
      var st=(p<0.30||p>0.985)?0 : p>=0.80?3 : p>=0.70?2 : p>=0.60?1 : 0;
      if(st!==stage){ stage=st; go(st); }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
