<title>AJ Groups Signal Poster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
  9:16 poster after the "Shipment" reference, in the AJ GROUPS palette, kept minimal:
  a deep navy field, one glowing gold ring (a corona, lit brighter along one arc) and a faint outer orbit,
  with film grain. The centre stack runs straight through the ring:
  AJ monogram (new logo), pixel infinity, dots, AJ GROUPS in vertical pixel type, line, mark.
*/
:root{
  --cream:#f4f1ea; --gold-soft:#f3dfb8; --gold:#debd87;
  --navy:#2d3041; --ink:#0a0b11;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;background:var(--ink);overflow:hidden}
.poster{position:relative;overflow:hidden;container-type:size;height:min(100vh,177.78vw);width:min(100vw,56.25vh);
  background:radial-gradient(110% 64% at 50% 47.5%,#272b3d 0%,#191b28 42%,#0d0e16 72%,#0a0b11 100%)}

/* the corona: a thin gold ring with a soft bloom, brightest along its upper-left arc */
.ring,.arc,.halo,.orbit{position:absolute;left:50%;top:47.5%;border-radius:50%;transform:translate(-50%,-50%)}
.halo{width:74cqw;height:74cqw;background:radial-gradient(closest-side,transparent 86%,rgba(222,189,135,.16) 93%,transparent 100%);filter:blur(1.6cqw)}
.ring{width:68cqw;height:68cqw;border:.28cqw solid rgba(243,223,184,.55);box-shadow:0 0 2.4cqw rgba(222,189,135,.35),inset 0 0 2.4cqw rgba(222,189,135,.22)}
.arc{width:68cqw;height:68cqw;
  background:conic-gradient(from 210deg,transparent 0deg,rgba(255,244,222,.95) 40deg,rgba(243,223,184,.6) 80deg,transparent 140deg,transparent 360deg);
  -webkit-mask:radial-gradient(closest-side,transparent calc(100% - .9cqw),#000 calc(100% - .5cqw),#000 100%,transparent 100%);
          mask:radial-gradient(closest-side,transparent calc(100% - .9cqw),#000 calc(100% - .5cqw),#000 100%,transparent 100%);
  filter:blur(.35cqw) drop-shadow(0 0 1.6cqw rgba(243,223,184,.7))}
.orbit{width:118cqw;height:118cqw;border:.12cqw solid rgba(243,223,184,.09)}

.grain{position:absolute;inset:0;width:100%;height:100%;opacity:.26;mix-blend-mode:overlay;pointer-events:none}
.grain2{position:absolute;inset:0;width:100%;height:100%;opacity:.06;pointer-events:none}

.stack{position:absolute;left:50%;top:15.5%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;color:var(--cream)}
.mark{display:block;width:auto;height:11cqw}
.inf{margin-top:3.6cqw;width:5.2cqw;height:auto;display:block}
.inf rect{fill:var(--cream)}
.dot{width:.62cqw;height:.62cqw;background:var(--cream);margin-top:4cqw}
.word{margin-top:3.6cqw;writing-mode:vertical-rl;font-family:'Silkscreen',monospace;font-weight:400;font-size:6.6cqw;line-height:1;letter-spacing:-.04em;color:var(--cream);white-space:nowrap;transform:scaleY(1.18);transform-origin:50% 0;margin-bottom:6cqw}
.line{margin-top:4cqw;writing-mode:vertical-rl;font-family:'Inter',sans-serif;font-weight:500;font-size:1.55cqw;line-height:1.25;letter-spacing:.02em;text-transform:uppercase;color:var(--cream);white-space:nowrap}
.sq{margin-top:8.5cqw;width:2.8cqw;height:2.8cqw;border:.5cqw solid var(--cream);display:grid;place-items:center}
.sq i{width:.8cqw;height:.8cqw;background:var(--cream)}
.foot{position:absolute;left:0;right:0;bottom:4.2%;text-align:center;font-family:'Inter',sans-serif;font-size:1.5cqw;letter-spacing:.42em;color:rgba(244,241,234,.45);text-transform:uppercase}
</style>

<div class="poster" id="poster">
  <div class="orbit"></div>
  <div class="halo"></div>
  <div class="ring"></div>
  <div class="arc"></div>

  <div class="stack">
    <img class="mark" src="brand/logo-mark-gold.webp" alt="AJ">
    <svg class="inf" id="inf" viewBox="0 0 11 5" aria-hidden="true" shape-rendering="crispEdges"></svg>
    <i class="dot"></i><i class="dot"></i>
    <div class="word">AJ GROUPS</div>
    <i class="dot"></i>
    <div class="line">Ideas received.<br>Brands deployed.</div>
    <div class="sq"><i></i></div>
  </div>
  <div class="foot">ajgroups.co</div>

  <svg class="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <svg class="grain2" aria-hidden="true"><filter id="n2"><feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n2)"/></svg>
</div>

<script>
(function(){
  /* pixel infinity: "limitless possibilities" */
  var P=['.###...###.','#..##.##..#','#...###...#','#..##.##..#','.###...###.'], s='';
  P.forEach(function(row,y){ for(var x=0;x<row.length;x++) if(row[x]==='#') s+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'; });
  document.getElementById('inf').innerHTML=s;
  window.__built=true;
})();
</script>
