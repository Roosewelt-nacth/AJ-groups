<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AJ GROUPS · Allwyn (from the character sheet)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d0d0d;color:#f3f0ea;font-family:Inter,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.t{position:fixed;left:clamp(22px,4.2vw,64px);top:50%;transform:translateY(-50%);z-index:2;width:min(44vw,600px)}
.t p{margin:0 0 18px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#a9a8a4}
.t h1{margin:0 0 20px;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(38px,5vw,78px);line-height:1.04}
.t h1 em{font-style:italic}.t span{font-size:15px;line-height:1.7;color:#a9a8a4;display:block;max-width:38ch}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head><body><canvas id="c"></canvas>
<div class="t"><p>AJ GROUPS · Founder</p><h1>Allwyn,<br><em>curious by nature.</em></h1><span>A traveller who builds wherever he sees an opening.</span></div>
<script type="module">
import * as THREE from 'three';
const q=new URLSearchParams(location.search),F=parseFloat(q.get('t')||'NaN');
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene();{const cv=document.createElement('canvas');cv.width=cv.height=512;const x=cv.getContext('2d'),g=x.createRadialGradient(320,230,0,256,256,430);g.addColorStop(0,'#3a3733');g.addColorStop(.55,'#1a1917');g.addColorStop(1,'#0a0a0a');x.fillStyle=g;x.fillRect(0,0,512,512);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;sc.background=t}
const cam=new THREE.PerspectiveCamera(30,1,.1,50);cam.position.set(0,0,9);
const tex=new THREE.TextureLoader().load('../../assets/allwyn/allwyn_walk.png',t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;build(t)});
let fig,shadow,dust;
function build(t){const ar=t.image.width/t.image.height,H=4.1;
 shadow=new THREE.Mesh(new THREE.PlaneGeometry(1.8,.36),new THREE.MeshBasicMaterial({map:glow(),transparent:true,opacity:.55,depthWrite:false}));shadow.position.set(0,-H/2-.02,-.05);sc.add(shadow);
 fig=new THREE.Mesh(new THREE.PlaneGeometry(H*ar,H),new THREE.MeshBasicMaterial({map:t,transparent:true,alphaTest:.02}));sc.add(fig);
 const n=500,p=new Float32Array(n*3);for(let i=0;i<n;i++)p.set([(Math.random()-.5)*16,(Math.random()-.5)*9,(Math.random()-.5)*6-1],i*3);
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));dust=new THREE.Points(g,new THREE.PointsMaterial({size:3,sizeAttenuation:false,color:0xf1e6d3,transparent:true,opacity:.35,depthWrite:false,map:glow()}));sc.add(dust);
 fit();loop()}
function glow(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
const ptr={x:0,y:0};addEventListener('pointermove',e=>{ptr.x=e.clientX/innerWidth*2-1;ptr.y=e.clientY/innerHeight*2-1});
function fit(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;const ph=innerWidth<=760;cam.setViewOffset(innerWidth,innerHeight,ph?0:-innerWidth*.2,ph?innerHeight*.12:0,innerWidth,innerHeight);cam.updateProjectionMatrix()}
addEventListener('resize',fit);
const clk=new THREE.Clock();
function loop(){const t=isNaN(F)?clk.getElapsedTime():F;
 fig.position.y=Math.abs(Math.sin(t*2.2))*.09;fig.rotation.z=Math.sin(t*2.2)*.012;fig.rotation.y=ptr.x*.14+Math.sin(t*.5)*.03;
 shadow.scale.x=1-Math.abs(Math.sin(t*2.2))*.1;dust.rotation.y=t*.01;
 r.render(sc,cam);requestAnimationFrame(loop)}
</script></body></html>
