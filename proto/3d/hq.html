<style>
  .card .now{display:flex;gap:8px;align-items:baseline;margin:10px 2px 0;font-size:13px}
  .card .now b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;flex:none}
  .card .now b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#1e7b34;margin-right:6px;animation:live 1.6s ease-in-out infinite}

  @keyframes live{50%{opacity:.3}}
  .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  @media (max-width:760px){.card .now,.card .ask{grid-column:2}}
</style>
