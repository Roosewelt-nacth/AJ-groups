.dev{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 210px;background:#1d1d1f;color:#e8e8ea}.dimg{position:relative;display:grid;place-items:center;overflow:hidden;min-height:0}.dimg .pic{position:relative;max-width:92%;max-height:76%;aspect-ratio:4/5;height:76%;margin-top:-34px;overflow:hidden;border-radius:4px;box-shadow:0 14px 40px rgba(0,0,0,.6)}.dimg .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.dimg .gr,.dimg .vg{position:absolute;inset:0;pointer-events:none}.dimg .gr{mix-blend-mode:overlay}.dimg .vg{background:radial-gradient(closest-side,transparent 55%,#000 130%)}.dimg .fn{position:absolute;left:14px;top:10px;font-family:var(--mono);font-size:10px;color:#9a9aa0;letter-spacing:.06em}.dimg .strip2{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:6px;justify-content:center}.dimg .strip2 button{all:unset;width:34px;height:42px;border-radius:3px;overflow:hidden;opacity:.55;cursor:pointer;border:1px solid transparent}.dimg .strip2 button.on{opacity:1;border-color:#fff}.dimg .strip2 img{width:100%;height:100%;object-fit:cover;display:block}

/* wallpapers: each slot holds a soft copy and a sharp copy; the sharp one shows under the cursor */

.mbar{color:var(--fg);transition:background .6s,color .6s,border-color .6s}.mbar .ex{color:var(--fgm)}.mbar .ex b{color:var(--fg)}

.hello h1{color:var(--fg)}.hello p,.hello .lab{color:var(--fgm)}
